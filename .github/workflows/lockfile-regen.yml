name: Lockfile Regen (temporary, VCFO-066)

# TEMPORARY. Added on the chore/vcfo-066-** branch only, to regenerate
# package-lock.json after the overrides change in package.json. The maintainer's
# network cannot reach registry.npmjs.org, so `npm install` has to run here.
# This file is deleted before the pull request is opened and never lands on main.

on:
  push:
    branches: ["chore/vcfo-066-**"]

permissions:
  contents: read

concurrency:
  group: lockfile-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    name: Regenerate lockfile and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Resolve dependencies against the new overrides
        run: npm install

      - name: Show the resulting lockfile diff
        run: |
          git --no-pager diff --stat -- package-lock.json
          echo "--- vite and esbuild resolutions ---"
          node -e '
            const p = require("./package-lock.json").packages;
            console.log("vite:", p["node_modules/vite"].version);
            for (const k of Object.keys(p).filter((k) => /(^|\/)node_modules\/esbuild$/.test(k))) {
              console.log(k + ":", p[k].version);
            }
          '

      - name: Run full validation gate
        run: npm run validate

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
