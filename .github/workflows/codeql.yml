# `Analyze JavaScript and TypeScript` (the job name below) is a required status check on
# `main`, so the name is load-bearing and must not be renamed — even though `languages` now
# also analyses `actions` and the name no longer describes the full set. Renaming the job
# strands the old context at "Expected — waiting for status to be reported" and blocks every
# pull request; update the branch-protection contexts first if it ever has to move. Matrixing
# the job does the same thing, because GitHub appends the matrix value to the check name.
#
# For the same reason this workflow carries no `paths` filter: a path-filtered required check
# never fires and never reports, so the merge is blocked with everything else green (VCFO-102).
#
# The `concurrency` block below is safe against that wire: it is neither a job rename nor a
# `paths` filter, the check context is untouched, and a superseded run's replacement is the one
# that reports. (VCFO-108)
#
# `actions` is analysed because the six workflow files are this repository's privileged
# surface; `actions: read` below is already the permission that language needs.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 2 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript,actions
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
