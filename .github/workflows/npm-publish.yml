# Publishing uses npm trusted publishing (OIDC): the registry mints a short-lived
# credential from the `id-token: write` token below, so no NODE_AUTH_TOKEN is needed.
#
# The trusted publisher registered on npmjs.com is bound to this repository AND to
# this workflow's filename. Renaming this file, moving the publish job into another
# workflow, or renaming/transferring the repo breaks publishing with an auth error
# until the binding is updated under the package's "Publishing access" settings.
#
# `--provenance` is implied by trusted publishing; it is kept explicit for clarity.
#
# This workflow deliberately carries no `concurrency` block. Every other workflow that can be
# superseded cancels in-flight runs, but a publish must never be cancelled part-way. (VCFO-108)
#
# Two jobs, on purpose. Under trusted publishing the `id-token: write` scope IS the publish
# credential, so it must not sit in the same job as `npm ci` (dependency lifecycle scripts),
# `npm test` and the VitePress build, any of which could mint the OIDC token and publish an
# arbitrary tarball before the real publish step ran. `build` holds no `id-token`, does every
# step that executes repository or dependency code, and uploads the `npm pack` tarball.
# `publish` holds the scope, does no checkout and installs nothing: publishing a tarball runs
# no lifecycle scripts, so the only code that can reach the token is the npm CLI itself. The
# `npm` environment (required reviewer, `v*` tag policy) gates `publish` alone, since that is
# the job that spends the credential. (VCFO-112)

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and test package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm publishes are irreversible, and nothing else compares the release tag to the tree
      # being published: tagging v3.4.0 on a tree still at 3.3.0 would publish 3.3.0 under a
      # release announcing 3.4.0. The tag reaches the shell through an `env:` binding rather
      # than a `${{ }}` expression interpolated into `run:`. `node` is preinstalled on
      # ubuntu-latest, so this runs before Setup Node and fails before `npm ci`. (VCFO-109)
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$pkg" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $pkg"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build documentation
        run: npm run docs:build

      # `npm test` has already run `npm run build`, so `dist/` is current. The tarball is the
      # exact artifact `publish` uploads; nothing is rebuilt or re-resolved on the other side.
      - name: Pack
        run: |
          mkdir -p package-tarball
          npm pack --pack-destination package-tarball
          ls -l package-tarball

      - name: Upload package tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: package-tarball/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-tarball

      # No `cache: npm`: there is no lockfile here, and nothing is installed.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        run: |
          set -- package-tarball/*.tgz
          if [ "$#" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found $#"
            exit 1
          fi
          npm publish "$1" --access public --provenance
