# Publishing uses npm trusted publishing (OIDC): the registry mints a short-lived
# credential from the `id-token: write` token below, so no NODE_AUTH_TOKEN is needed.
#
# The trusted publisher registered on npmjs.com is bound to this repository AND to
# this workflow's filename. Renaming this file, moving the publish job into another
# workflow, or renaming/transferring the repo breaks publishing with an auth error
# until the binding is updated under the package's "Publishing access" settings.
#
# `--provenance` is implied by trusted publishing; it is kept explicit for clarity.
#
# This workflow deliberately carries no `concurrency` block. Every other workflow that can be
# superseded cancels in-flight runs, but a publish must never be cancelled part-way. (VCFO-108)

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build documentation
        run: npm run docs:build

      - name: Publish
        run: npm publish --access public --provenance
