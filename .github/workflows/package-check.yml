# `Verify npm package contents` is a required status check on `main`, so this workflow
# deliberately carries no `paths` filter. GitHub does not auto-pass a path-filtered
# required check: a PR touching nothing in such a filter never fires the workflow, the
# context stays at "Expected — waiting for status to be reported", and the merge is
# blocked. A filter also let publish-affecting files (CHANGELOG.md, LICENSE, NOTICE and
# .npmignore are all part of the published tarball) skip the very check that verifies it.
# The job takes ~15s; do not reintroduce a filter to save that (VCFO-102).

name: Package Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Verify npm package contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package output
        run: npm run build

      - name: Validate package contents
        run: npm run validate:package
