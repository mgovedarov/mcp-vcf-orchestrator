name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: `build` runs repository code (`npm ci` lifecycle scripts and the VitePress
# config), so it is the job least suited to holding an OIDC-mintable `id-token: write`. Only
# `deploy` needs the Pages scopes, so they are declared there. A job-level `permissions:` block
# REPLACES this one rather than merging with it, which is why `contents: read` is restated on
# both jobs. (VCFO-107)
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # No `actions/configure-pages` step: its only purpose here would be to discover the base
      # path, and `docs/.vitepress/config.ts` hardcodes `base: "/mcp-vcf-orchestrator/"`. The step
      # carried no `id:`, so its outputs were unreachable anyway, and Pages is already on
      # `build_type: workflow`, so nothing needs enabling. (VCFO-107)

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
