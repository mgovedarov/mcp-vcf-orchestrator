version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Sofia
    # A freshly published dependency release is not proposed until it has been on the
    # registry for a week, so a compromised publish that the ecosystem catches within
    # days never reaches a pull request here. Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      # init, autobuild and analyze must run the same action version, so
      # bump them together instead of one PR per step (each fails alone).
      codeql-action:
        patterns:
          - "github/codeql-action*"
